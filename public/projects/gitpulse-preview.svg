<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#14141e"/>
    </linearGradient>
    <linearGradient id="greenPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Window Header -->
  <rect x="0" y="0" width="800" height="38" fill="#0d0d14" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="20" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="19" r="5" fill="#10b981"/>
  <text x="80" y="24" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="600">gitpulse // spring-boot-api:8080/api/v1/github/analytics</text>
  <rect x="650" y="8" width="130" height="22" rx="4" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
  <text x="662" y="23" fill="#10b981" font-family="monospace" font-size="10" font-weight="700">● REDIS CACHED (TTL 600s)</text>

  <!-- Left: Endpoints & Concurrency Architecture -->
  <rect x="24" y="58" width="370" height="368" rx="8" fill="#111119" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="40" y="86" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">SPRING BOOT @Async CONCURRENCY</text>
  <text x="40" y="104" fill="#64748b" font-family="monospace" font-size="10">THREAD POOL: CompletableFuture // Redis Lettuce Driver</text>

  <!-- Endpoint 1 -->
  <rect x="40" y="122" width="338" height="58" rx="6" fill="#171722" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <rect x="52" y="134" width="46" height="18" rx="3" fill="#10b981" />
  <text x="75" y="147" fill="#000" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">GET</text>
  <text x="108" y="147" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">/api/v1/users/{user}/languages</text>
  <text x="52" y="168" fill="#94a3b8" font-family="monospace" font-size="9">Language Byte Distribution (Java, TS, Go, Python) // 14ms</text>

  <!-- Endpoint 2 -->
  <rect x="40" y="190" width="338" height="58" rx="6" fill="#171722" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <rect x="52" y="202" width="46" height="18" rx="3" fill="#3b82f6" />
  <text x="75" y="215" fill="#fff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">GET</text>
  <text x="108" y="215" fill="#f8fafc" font-family="monospace" font-size="11" font-weight="600">/api/v1/users/{user}/velocity</text>
  <text x="52" y="236" fill="#94a3b8" font-family="monospace" font-size="9">Commit Cadence, PR Acceptance &amp; Contributor Score // 18ms</text>

  <!-- Concurrency Graph -->
  <rect x="40" y="258" width="338" height="152" rx="6" fill="#0a0a0f" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="52" y="278" fill="#64748b" font-family="monospace" font-size="10">CONCURRENCY &amp; CACHE HIT METRICS</text>
  <!-- Bar 1 -->
  <text x="52" y="302" fill="#94a3b8" font-family="monospace" font-size="9">Direct API: Rate-Limited (60 req/hr)</text>
  <rect x="52" y="308" width="60" height="8" rx="2" fill="#ef4444"/>
  <!-- Bar 2 -->
  <text x="52" y="332" fill="#94a3b8" font-family="monospace" font-size="9">GitPulse Cached: 2,400+ req/sec</text>
  <rect x="52" y="338" width="310" height="8" rx="2" fill="#10b981"/>
  <!-- Bar 3 -->
  <text x="52" y="362" fill="#94a3b8" font-family="monospace" font-size="9">Redis Cache Hit Ratio: 96.4%</text>
  <rect x="52" y="368" width="298" height="8" rx="2" fill="#38bdf8"/>
  <text x="52" y="394" fill="#10b981" font-family="monospace" font-size="9">✔ Resilient against GitHub secondary rate limits</text>

  <!-- Right: Developer Aggregator Analytics Dashboard -->
  <rect x="410" y="58" width="366" height="368" rx="8" fill="#111119" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="426" y="86" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">AGGREGATED DEVELOPER METRICS</text>
  <text x="426" y="104" fill="#64748b" font-family="monospace" font-size="10">PAYLOAD: JSON API Specification // ISO-8601 Timestamps</text>

  <!-- Metric Panels -->
  <g transform="translate(426, 122)">
    <rect width="164" height="80" rx="6" fill="#161622" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="12" y="24" fill="#64748b" font-family="monospace" font-size="9">AVG RESPONSE TIME</text>
    <text x="12" y="52" fill="#10b981" font-family="sans-serif" font-size="22" font-weight="800">14.8 ms</text>
    <text x="12" y="68" fill="#94a3b8" font-family="monospace" font-size="8">Redis MemTier verified</text>
  </g>

  <g transform="translate(600, 122)">
    <rect width="162" height="80" rx="6" fill="#161622" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="12" y="24" fill="#64748b" font-family="monospace" font-size="9">ACTIVE THREADS</text>
    <text x="12" y="52" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="800">64 Workers</text>
    <text x="12" y="68" fill="#94a3b8" font-family="monospace" font-size="8">CompletableFuture Pool</text>
  </g>

  <!-- Response Payload Mockup -->
  <rect x="426" y="214" width="336" height="196" rx="6" fill="#09090d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="440" y="236" fill="#38bdf8" font-family="monospace" font-size="10">{</text>
  <text x="452" y="254" fill="#94a3b8" font-family="monospace" font-size="9">"username": "NITHINKR06",</text>
  <text x="452" y="272" fill="#94a3b8" font-family="monospace" font-size="9">"cacheHit": true,</text>
  <text x="452" y="290" fill="#94a3b8" font-family="monospace" font-size="9">"primaryLanguages": ["TypeScript", "Python", "Java"],</text>
  <text x="452" y="308" fill="#94a3b8" font-family="monospace" font-size="9">"totalReposAnalyzed": 20,</text>
  <text x="452" y="326" fill="#94a3b8" font-family="monospace" font-size="9">"commitStreak": 84,</text>
  <text x="452" y="344" fill="#94a3b8" font-family="monospace" font-size="9">"securityScanStatus": "SECURE_CLEARED",</text>
  <text x="452" y="362" fill="#94a3b8" font-family="monospace" font-size="9">"latencyMs": 14.8</text>
  <text x="440" y="380" fill="#38bdf8" font-family="monospace" font-size="10">}</text>
</svg>
