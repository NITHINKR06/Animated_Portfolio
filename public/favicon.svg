<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.5" />
      <stop offset="70%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background with deep gradient -->
  <rect width="100" height="100" rx="30" fill="url(#bgGrad)"/>
  
  <!-- Shine effect for depth -->
  <rect width="100" height="100" rx="30" fill="url(#shine)"/>
  
  <!-- Subtle hexagon pattern (tech-inspired) -->
  <g opacity="0.06" stroke="white" stroke-width="0.8" fill="none">
    <path d="M 20 30 L 30 25 L 40 30 L 40 40 L 30 45 L 20 40 Z"/>
    <path d="M 60 30 L 70 25 L 80 30 L 80 40 L 70 45 L 60 40 Z"/>
    <path d="M 20 60 L 30 55 L 40 60 L 40 70 L 30 75 L 20 70 Z"/>
    <path d="M 60 60 L 70 55 L 80 60 L 80 70 L 70 75 L 60 70 Z"/>
  </g>
  
  <!-- Code bracket decorative elements -->
  <g opacity="0.2" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 12 32 Q 8 40 12 48"/>
    <path d="M 88 32 Q 92 40 88 48"/>
  </g>
  
  <!-- Main initials NKR with optimized spacing -->
  <g transform="translate(50, 52)">
    <text x="0" y="0" font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif" 
          font-size="32" font-weight="900" fill="url(#textGrad)" 
          text-anchor="middle" dominant-baseline="central" 
          letter-spacing="-1.5" filter="url(#glow) url(#textShadow)">NKR</text>
  </g>
  
  <!-- Elegant underline with gradient -->
  <line x1="28" y1="70" x2="72" y2="70" stroke="url(#textGrad)" stroke-width="3" 
        opacity="0.6" stroke-linecap="round"/>
  
  <!-- Premium corner details -->
  <g opacity="0.25">
    <circle cx="16" cy="16" r="2.5" fill="white"/>
    <circle cx="84" cy="84" r="2.5" fill="white"/>
    <rect x="14" y="14" width="5" height="5" rx="1" fill="none" stroke="white" stroke-width="1"/>
    <rect x="81" y="81" width="5" height="5" rx="1" fill="none" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Refined border with inner glow -->
  <rect x="2" y="2" width="96" height="96" rx="28" fill="none" stroke="white" stroke-width="1.5" opacity="0.15"/>
  <rect x="4" y="4" width="92" height="92" rx="26" fill="none" stroke="white" stroke-width="0.8" opacity="0.08"/>
</svg>
