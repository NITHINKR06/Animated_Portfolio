<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a night departure — calm, cinematic, a little romantic
   IDEA: the portfolio is a train; each coach is a project you board
   PICTURE: full-screen 3D dusk scene, green-and-cream coaches on a lit track
   COLOUR and TYPE: Brunswick green, cream, brass light; Fraunces + Instrument Sans
   LAYOUT: the scene is everything; UI is a whisper at the edges */
:root{color-scheme:dark;--ink:#f3e9d2;--muted:#c9bda3;--brass:#d9b061;--glass:rgba(12,18,16,.62)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#9fb7cf;color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.ui{position:fixed;pointer-events:none;z-index:2}
.brand{display:none!important}
.brand b{font:600 20px/1.1 Fraunces,Georgia,serif;display:block}
.brand span{color:var(--muted);font-size:14px}
.intro{left:max(6vw,18px);top:50%;transform:translateY(-50%);max-width:560px;transition:opacity .6s,transform .6s}
.intro h1{font:800 clamp(40px,7vw,84px)/1.02 Fraunces,Georgia,serif;margin:0 0 14px;text-wrap:balance}
.intro p{font-size:17px;color:var(--muted);margin:0;max-width:38ch}
.intro.off{opacity:0;transform:translateY(-46%)}
.label{left:0;top:0;transform:translate(-50%,-100%);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(217,176,97,.45);border-radius:14px;padding:10px 16px 11px;text-align:center;opacity:0;transition:opacity .3s;white-space:nowrap}
.label.on{opacity:1}
.label small{display:block;color:var(--brass);font-size:13px}
.label strong{display:block;font:600 22px/1.15 Fraunces,Georgia,serif}
.label em{display:block;font-style:normal;color:var(--muted);font-size:13px;margin-top:2px}
.hint{left:50%;bottom:22px;transform:translateX(-50%);font-size:14px;color:var(--muted);background:rgba(10,12,20,.45);padding:8px 14px;border-radius:999px;text-align:center;max-width:92vw;transition:opacity .3s}
.rail{right:max(2.4vw,10px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.rail button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:flex-end;gap:10px;height:28px;color:var(--muted);font-size:13px}
.rail button i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--brass);transition:transform .25s,background .25s}
.rail button span{opacity:0;transition:opacity .25s}
.rail button:hover span,.rail button:focus-visible span,.rail button.on span{opacity:1}
.rail button.on i{background:var(--brass);transform:scale(1.25)}
.rail button:focus-visible i{outline:2px solid var(--ink);outline-offset:3px}
#back{top:16px;left:max(4vw,16px);pointer-events:auto;font:600 15px "Instrument Sans",system-ui;color:var(--ink);background:var(--glass);border:1px solid rgba(217,176,97,.5);border-radius:999px;padding:0 18px;height:44px;cursor:pointer;opacity:0;visibility:hidden;transition:opacity .4s}
#back.on{opacity:1;visibility:visible}
#back:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.brand.off{opacity:0}
.brand{transition:opacity .4s}
.brand,.intro,.rail button{text-shadow:0 1px 2px rgba(6,14,28,.55),0 2px 22px rgba(6,14,28,.45)}
.intro h1{color:#fff}.intro p{color:#f2f5f9}.brand span{color:#e9eef4}
.rail button{color:#f2f5f9}.rail button i{background:rgba(10,20,30,.35);box-shadow:0 1px 6px rgba(0,0,0,.35)}
.rail button.on i{background:var(--brass)}
.ticket{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:16px;opacity:0;transition:opacity .25s}
.ticket[hidden]{display:none}
.ticket.on{opacity:1}
.tk-back{position:absolute;inset:0;background:rgba(6,14,12,.62);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.tk-card{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 220px;grid-template-rows:minmax(0,1fr);width:min(920px,calc(100vw - 32px));height:min(88vh,760px);max-height:min(88vh,760px);background:linear-gradient(180deg,#153a2f,#0b231c);color:var(--ink);border:2px solid var(--brass);border-radius:18px;box-shadow:0 0 0 6px rgba(13,34,27,.9),0 0 0 7px rgba(217,176,97,.55),0 30px 80px rgba(0,0,0,.5);transform:translateY(12px) scale(.98);transition:transform .3s;overflow:hidden}
.ticket.on .tk-card{transform:none}
.tk-main{padding:30px 34px 28px;overflow-y:auto;overflow-x:hidden;min-height:0;height:100%;max-height:100%;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--brass) rgba(0,0,0,.25)}
.tk-main::-webkit-scrollbar{width:6px}
.tk-main::-webkit-scrollbar-track{background:rgba(0,0,0,.2);border-radius:4px}
.tk-main::-webkit-scrollbar-thumb{background:var(--brass);border-radius:4px}
.tk-kicker{margin:0 0 6px;color:var(--brass);font-size:14px;font-weight:600}
.tk-card h2{margin:0;font:800 clamp(32px,5vw,46px)/1.05 Fraunces,Georgia,serif;text-wrap:balance}
.tk-sub{margin:6px 0 0;color:var(--acc);font:600 20px/1.3 Fraunces,Georgia,serif}
.tk-desc{margin:18px 0 0;font-size:17px;line-height:1.6;color:#ece2c9;max-width:60ch}
.tk-data{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:22px 0 0}
.tk-data div{border:1px solid rgba(217,176,97,.35);border-radius:12px;padding:10px 14px;background:rgba(255,255,255,.03)}
.tk-data dt{font-size:13px;color:#bcae8e}.tk-data dd{margin:2px 0 0;font:600 20px/1.2 Fraunces,Georgia,serif;white-space:nowrap}
.tk-main h3{margin:24px 0 10px;font:600 14px "Instrument Sans",system-ui;color:var(--brass)}
.tk-skills,.tk-tools{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.tk-skills li{padding:6px 14px;border:1.5px solid var(--brass);border-radius:999px;font-size:15px;color:#f3e7cc}
.tk-tools li{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;background:#f8f4ea;color:#16302a;border-radius:12px;font-size:15px;font-weight:600}
.tk-tools svg{width:22px;height:22px}
.tk-mono{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;font-size:10px}
.tk-open{display:inline-flex;align-items:center;min-height:44px;margin-top:26px;padding:0 22px;border-radius:999px;background:var(--brass);color:#14261f;font-weight:700;text-decoration:none}
.tk-open:hover{filter:brightness(1.08)}
.tk-stub{position:relative;display:flex;flex-direction:column;gap:6px;padding:76px 22px 22px 26px;border-left:2px dashed rgba(217,176,97,.6);background:rgba(217,176,97,.07);font-size:14px;color:#cfc3a6;min-height:0;height:100%;max-height:100%;box-sizing:border-box;overflow:hidden}
.tk-stub::before,.tk-stub::after{content:"";position:absolute;left:-13px;width:24px;height:24px;border-radius:50%;background:#0b1712;border:2px solid var(--brass);z-index:2}
.tk-stub::before{top:-13px}.tk-stub::after{bottom:-13px}
.tk-rail{font:600 13px "Instrument Sans",system-ui;color:var(--brass)}
.tk-stub strong{font:800 24px/1.1 Fraunces,Georgia,serif;color:var(--ink);margin:4px 0 8px;overflow-wrap:anywhere}
.tk-nav{margin-top:auto;display:flex;gap:10px;padding-top:12px}
.tk-nav button,.tk-x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--brass);background:rgba(0,0,0,.2);color:var(--ink);font-size:18px;cursor:pointer}
.tk-x{position:absolute;top:12px;right:12px;font-size:24px;line-height:1;z-index:5}
.tk-nav button:hover,.tk-x:hover{background:rgba(217,176,97,.2)}
.ticket :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media(max-width:640px){.tk-card{grid-template-columns:minmax(0,1fr);overflow:auto}.tk-main{padding:26px 20px;overflow:visible}.tk-stub{order:-1;flex-direction:row;flex-wrap:wrap;align-items:center;border-left:0;border-bottom:2px dashed rgba(217,176,97,.6);padding:16px 64px 16px 20px}.tk-stub::before,.tk-stub::after{display:none}.tk-stub strong{display:none}.tk-nav{margin:0 0 0 auto}}
@media(prefers-reduced-motion:reduce){.ticket,.tk-card{transition:none}}
.say{position:fixed;left:0;top:0;z-index:5;pointer-events:none;max-width:min(320px,80vw);padding:12px 18px 13px;background:#fbf6ea;color:#14302a;border:2px solid var(--acc,#d9b061);border-radius:18px;font:500 18px/1.3 "Instrument Sans",system-ui,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;margin-top:-14px;transition:opacity .2s,margin .25s;text-align:center}
.say b{font:800 20px/1.2 Fraunces,Georgia,serif}
.say::after{content:"";position:absolute;left:50%;bottom:-11px;width:18px;height:18px;background:#fbf6ea;border-right:2px solid var(--acc,#d9b061);border-bottom:2px solid var(--acc,#d9b061);transform:translateX(-50%) rotate(45deg)}
.say.on{opacity:1;margin-top:-22px}
@media(prefers-reduced-motion:reduce){.say{transition:none}}
#loader{inset:0;display:grid;place-items:center;background:#7f9bb8;color:#fff;transition:opacity .8s;z-index:5;font:600 18px Fraunces,Georgia,serif;color:var(--muted)}
#loader.done{opacity:0}
@media(max-width:600px){.rail button span{display:none}.label strong{font-size:18px}.hint{font-size:13px;bottom:14px}}
</style>
</head>
