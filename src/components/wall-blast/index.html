<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@500;600&display=swap">
<style>
/* VOICE: a building site at dusk, physical and believable.
   IDEA: the skills sit behind a real stone wall that workers knock down.
   PICTURE: the 3D wall, workers, ladder and rubble fill the pinned screen.
   COLOUR and TYPE: warm charcoal ground, stone greys, brand-coloured skill logos; Archivo + Inter.
   LAYOUT: one pinned stage: heading and centred skill grid behind the wall. */
:root{color-scheme:dark;--bg:#141210;--ink:#efe9e1;--mute:#a89f94;--card:#1f1c19;--line:#3a342e;--accent:#ffc21a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h2{font-family:Archivo,system-ui,sans-serif;font-weight:800;line-height:1.05;margin:0}
#skills{height:300vh;position:relative}
.stage{position:sticky;top:0;height:100vh;overflow:hidden;background:radial-gradient(120% 80% at 50% 30%,#2b2621 0%,#191613 55%,#100e0c 100%)}
.grid-wrap{position:absolute;left:0;right:0;top:8%;height:60%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 16px;z-index:0}
.grid-wrap h2{font-size:clamp(28px,3.6vw,44px)}
.grid{display:flex;flex-direction:column;align-items:center;gap:var(--g);--t:118px;--g:14px}
.row{display:flex;gap:var(--g)}
.row.off{transform:translateX(calc((var(--t) + var(--g))/2))}
.tile{position:relative;width:var(--t);height:var(--t);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--c) 22%,transparent) 0%,transparent 62%),linear-gradient(165deg,#26221e,#1a1715);
  border:1px solid color-mix(in srgb,var(--c) 22%,#3a342e);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 24px -14px rgba(0,0,0,.8);transition:transform .25s,border-color .25s,box-shadow .25s}
.tile:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 60%,#3a342e);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 16px 30px -14px color-mix(in srgb,var(--c) 55%,transparent)}
.tile svg{width:42px;height:42px;fill:var(--c);filter:drop-shadow(0 4px 12px color-mix(in srgb,var(--c) 45%,transparent))}
.tile span{font-weight:600;font-size:14px;letter-spacing:.01em;color:var(--ink);text-align:center;line-height:1.15;padding:0 6px}
canvas#c{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block;touch-action:pan-y}
canvas#c.aim{cursor:crosshair}
.tools{position:absolute;z-index:3;right:14px;bottom:14px;display:flex;gap:8px}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(16,14,12,.78);border:1px solid var(--line);color:var(--ink);cursor:pointer;padding:0}
.ibtn:hover{border-color:var(--accent)}
.ibtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn[disabled]{opacity:.35;cursor:default}
.loader{position:absolute;z-index:4;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;transition:opacity .3s}
.loader.gone{opacity:0;pointer-events:none}
.cue{position:absolute;z-index:3;left:50%;bottom:22px;margin-left:-14px;width:28px;height:28px;color:var(--accent);transition:opacity .4s;animation:bob 1.6s ease-in-out infinite;pointer-events:none}
.cue svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cue.gone{opacity:0}
.bubble{position:absolute;left:0;top:0;z-index:2;background:#fffaf0;color:#1d1a16;font:600 14px/1.25 Inter,system-ui,sans-serif;padding:7px 12px;border-radius:14px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;will-change:transform}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#fffaf0}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(6px)}}
@media(max-width:900px){.grid{--t:104px;--g:12px}.tile svg{width:38px;height:38px}}
@media(max-width:600px){.grid{--t:86px;--g:10px}.tile{border-radius:18px;gap:7px}.tile svg{width:32px;height:32px}.tile span{font-size:12.5px}}
@media(prefers-reduced-motion:reduce){.cue,.loader{animation:none}}
</style>
</head>
<body>
<section id="skills" aria-label="Skills">
  <div class="stage">
    <div class="grid-wrap" id="gridWrap">
      <h2>Skills</h2>
      <div class="grid" id="grid"></div>
    </div>
    <canvas id="c" aria-hidden="true"></canvas>
    <div class="tools">
      <button class="ibtn" id="sound" type="button" aria-label="Mute sound" aria-pressed="false"></button>
      <button class="ibtn" id="rebuild" type="button" aria-label="Rebuild the wall"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </div>
    <div class="loader" id="loader"></div>
    <div class="cue" id="cue"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>

  if(d<2.4||rnd()<0.3){wall.remove(b.mesh);b.mesh.geometry.dispose();for(const m of fracture(b,d<1.4)){scene.add(m);addBody(m,v(),new V3(rr(-10,10),rr(-10,10),rr(-10,10)),true)}spawnGrit(new V3(b.cx,b.cy,FRONT+0.05),d<1.4?40:15,1.6)}
  else{const m=b.mesh;wall.remove(m);scene.add(m);addBody(m,v(),new V3(rr(-5,5),rr(-4,4),rr(-4,4)),true)}
  if(rnd()<0.18)addFx(dustTex,false,new V3(b.cx,b.cy,FRONT+0.2),v().multiplyScalar(0.3),rr(2.5,4.5),rr(0.4,0.8),rr(1.6,3),'smoke',0.4)}
const rings=[];function shockRing(p){const m=new THREE.Mesh(new THREE.RingGeometry(0.85,1,48),new THREE.MeshBasicMaterial({color:0xfff1d6,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));m.position.copy(p).setZ(FRONT+0.4);scene.add(m);rings.push({m,t:0})}
const timers=[];function later(t,fn){timers.push({t,fn})}
function stepDemo(dt){for(let i=flashes.length-1;i>=0;i--){const f=flashes[i];f.t+=dt;f.L.intensity=90*Math.exp(-f.t*6);if(f.t>1.2){scene.remove(f.L);flashes.splice(i,1)}}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.t+=dt;const k=r.t/0.5;r.m.scale.setScalar(0.3+k*7);r.m.material.opacity=0.6*(1-k);if(k>=1){scene.remove(r.m);r.m.material.dispose();rings.splice(i,1)}}
  for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const f=timers[i].fn;timers.splice(i,1);f()}}
  for(const c of DEMO.charges)if(c.armed&&c.mesh){const led=c.mesh.userData.led;led.material.emissiveIntensity=(Math.sin(performance.now()/(DEMO.fast?55:170))>0)?3.5:0.15}}

/* ================= input ================= */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new V3(0,0,1),-FRONT);
function wallPoint(e){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);const p=ray.ray.intersectPlane(plane,new V3());if(!p||p.y<0.03||p.y>WALL_TOP+CAP_H)return null;return p}
const marks=[],markGeo=new THREE.RingGeometry(0.05,0.075,24),markMat=new THREE.MeshBasicMaterial({color:0xffc21a,transparent:true,depthTest:false});
let intro=true;const clickTimes=[];
canvas.addEventListener('pointermove',e=>{canvas.classList.toggle('aim',!intro&&!DEMO.active&&!!wallPoint(e))});
function enqueue(p){let b=brickAt(p.x,p.y);if(!b){b=nearestAlive(p.x,p.y,0.22);if(!b)return}
  p.x=clamp(p.x,b.x0+0.07,b.x1-0.07);p.y=clamp(p.y,b.y0+Math.min(0.08,b.h/3),b.y1-Math.min(0.08,b.h/3));p.z=FRONT;if(Math.abs(p.x)>halfVis(FRONT)-0.25)return;
  const now=performance.now();clickTimes.push(now);while(clickTimes.length&&now-clickTimes[0]>6000)clickTimes.shift();
  queue.push(p);const m=new THREE.Mesh(markGeo,markMat.clone());m.position.set(p.x,p.y,FRONT+0.05);m.renderOrder=5;scene.add(m);marks.push({m,t:0});
  if(queue.length>=10||clickTimes.length>=12)startDemolition();else checkCrew()}
canvas.addEventListener('pointerdown',e=>{if(intro||!workers.length||DEMO.active)return;const p=wallPoint(e);if(!p)return;audio();enqueue(p)});
rebuildBtn.addEventListener('click',()=>{if(DEMO.active)return;bodies.length=0;for(const m of debris){scene.remove(m);m.geometry.dispose()}debris.length=0;for(const d of fx){scene.remove(d.s);d.s.material.dispose()}fx.length=0;gLife.fill(0);for(let i=0;i<GN;i++)gPos[i*3+1]=-10;gritGeo.attributes.position.needsUpdate=true;
  hmap.fill(0);queue.length=0;wallGone=false;buildWall();if(LAD.state==='fallen'){LAD.state='stored';LAD.carrier=null}});

/* ================= layout & scroll intro ================= */
let builtFor=0;const baseCam=new V3();
function layout(){const W=stage.clientWidth,H=stage.clientHeight;renderer.setSize(W,H,false);camera.aspect=W/H;CAM_Z=camera.aspect>=1.25?9.6:Math.min(17,9.6*1.25/camera.aspect);
  const half=MU.degToRad(camera.fov/2),topY=WALL_TOP+CAP_H+0.3,pitch=half-Math.atan((topY-CAM_Y)/CAM_Z);camera.position.set(0,CAM_Y,CAM_Z);camera.lookAt(0,CAM_Y-CAM_Z*Math.tan(pitch),0);camera.updateProjectionMatrix();
  const need=halfVis(0)*2+3;if(broken===0&&!wallGone&&(need>wallW||Math.abs(need-builtFor)>3)){buildWall();builtFor=need}
  const top=new V3(0,WALL_TOP,FRONT).project(camera),bot=new V3(0,0.15,FRONT).project(camera),ty=(1-top.y)/2*H,by=(1-bot.y)/2*H;gridWrap.style.top=Math.round(ty+8)+'px';gridWrap.style.height=Math.max(160,Math.round(by-ty-16))+'px';baseCam.copy(camera.position)}
new ResizeObserver(layout).observe(stage);layout();
let progress=0,visible=true;
function readScroll(){const r=section.getBoundingClientRect(),span=section.offsetHeight-innerHeight;progress=clamp(-r.top/Math.max(1,span),0,1);cueEl.classList.toggle('gone',progress>0.02)}
addEventListener('scroll',readScroll,{passive:true});readScroll();
new IntersectionObserver(es=>{visible=es[0].isIntersecting},{rootMargin:'120px'}).observe(stage);
function introUpdate(w,dt){const S=w.S,m=w.man,start=-halfVis(FRONT+1)-1.2,st=new V3(-1.1,0,FRONT+1.05),wt=clamp((progress-0.03)/0.6,0,1),tx=start+(st.x-start)*wt,px=m.position.x;
  m.position.x+=(tx-px)*damp(dt,5);m.position.z=st.z;const v=(m.position.x-px)/Math.max(dt,1e-3),arrived=wt>=1&&Math.abs(m.position.x-st.x)<0.03;
  S.walkW=clamp(Math.abs(v)/0.3,0,1);S.walkTS=clamp(v/WALK_NATURAL,-1.2,1.2)||0.001;m.rotation.y+=angDiff(m.rotation.y,arrived?Math.PI-0.95:Math.PI/2)*damp(dt,arrived?4:9);
  S.ham.target=clonePose(arrived?POSE.ready:POSE.shoulder);S.lean=arrived?0.1:0;if(arrived&&Math.abs(angDiff(m.rotation.y,Math.PI-0.95))<0.05){intro=false;S.walkTS=1;brain(w)}}

/* ================= loop ================= */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(window.__dtMax||0.05,(now-last)/1000);last=now;if(!visible&&bodies.length===0&&!DEMO.active)return;
  for(const w of workers){if(w.dead)continue;if(intro&&w.lead)introUpdate(w,dt);else if(w.current&&w.current.update(dt)){const a=w.current;w.current=null;a.done()}
    if(!w.ST.onLadder&&!(w.current instanceof Climb)&&!(w.current instanceof RaiseLadder)){const m=w.man.position;m.y+=(heightAt(m.x,m.z)*0.85-m.y)*damp(dt,8)}poseCharacter(w,dt)}
  if(!workers.length)updateLadder();stepBodies(dt);stepFx(dt);stepGrit(dt);stepDemo(dt);stepBubbles(dt);
  for(let i=marks.length-1;i>=0;i--){const k=marks[i];k.t+=dt;k.m.material.opacity=Math.max(0,1-k.t/0.9);k.m.scale.setScalar(1+k.t*0.6);if(k.t>0.9){scene.remove(k.m);k.m.material.dispose();marks.splice(i,1)}}
  shake*=Math.exp(-dt*(shake>0.1?3.5:9));camera.position.set(baseCam.x+rr(-1,1)*shake,baseCam.y+rr(-1,1)*shake*0.6,baseCam.z);renderer.render(scene,camera)}
function loadAll(){return Promise.all([new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='man.js';sc.onerror=rej;sc.onload=()=>{try{const bin=atob(window.MAN_GLB),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);window.MAN_GLB=null;MAN_BUF=u.buffer;res()}catch(e){rej(e)}};document.head.appendChild(sc)}),
  fetch('anims.json').then(r=>r.json()).then(a=>{const c=a.map(x=>THREE.AnimationClip.parse(x));CLIPS={walk:c.find(x=>x.name==='walk'),idle:c.find(x=>x.name==='idle')}})])
  .then(parseMan).then(g=>{const w=new Worker(g,LOOKS[0],true);w.man.position.set(-halfVis(FRONT+1)-1.2,0,FRONT+1.05);w.man.rotation.y=Math.PI/2;workers.push(w)})}
loadAll().then(()=>loaderEl.classList.add('gone')).catch(e=>{console.error(e);loaderEl.classList.add('gone')});
requestAnimationFrame(frame);
window.__wall={get mode(){const w=workers[0];return intro?'intro':(w&&w.current?w.current.constructor.name:'idle')},get queue(){return queue.length},get broken(){return broken},get ladder(){return LAD.state},get workers(){return workers.filter(w=>!w.dead).length},get demo(){return DEMO.active},get phase(){return DEMO.phase},
  push:(x,y)=>enqueue(new V3(x,y,FRONT)),get ready(){return workers.length>0},get busy(){return workers.some(w=>!w.dead&&w.current&&w.current.constructor.name!=='Wait')},blastNow:()=>startDemolition()};
}
try{main()}catch(e){console.error(e);fallback()}
}
