<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:creator>Nithin K R (NITHINKR06)</dc:creator>
        <dc:title>NKR Portfolio Favicon</dc:title>
        <dc:description>Custom favicon for Nithin K R's personal portfolio.</dc:description>
        <dc:rights>Copyright © Nithin K R. All rights reserved. Do not remove attribution.</dc:rights>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <!-- 
    Author: Nithin K R — https://github.com/NITHINKR06
    License: Attribution required. Do not use without permission.
  -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.25" />
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background with depth -->
  <rect width="100" height="100" rx="30" fill="url(#bgGrad)"/>
  
  <!-- Subtle shine effect -->
  <rect width="100" height="100" rx="30" fill="url(#shine)"/>
  
  <!-- Refined diagonal accent -->
  <g opacity="0.12">
    <rect x="0" y="0" width="100" height="6" fill="url(#accentGrad)" transform="rotate(-45 50 3)"/>
    <rect x="0" y="94" width="100" height="6" fill="url(#accentGrad)" transform="rotate(45 50 97)"/>
  </g>
  
  <!-- Premium NKR typography -->
  <g transform="translate(50, 50)">
    <text x="0" y="0" font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif" 
          font-size="32" font-weight="700" fill="url(#textGrad)" 
          text-anchor="middle" dominant-baseline="central" 
          letter-spacing="2.5" filter="url(#glow) url(#textShadow)">NKR</text>
  </g>
  
  <!-- Elegant geometric accents -->
  <g opacity="0.4">
    <polygon points="18,22 22,18 26,22 22,26" fill="url(#textGrad)"/>
    <polygon points="74,74 78,70 82,74 78,78" fill="url(#textGrad)"/>
  </g>
  
  <!-- Refined accent line -->
  <line x1="27" y1="68" x2="73" y2="68" stroke="url(#textGrad)" stroke-width="3.5" 
        opacity="0.75" stroke-linecap="round"/>
  
  <!-- Premium corner details -->
  <g opacity="0.35">
    <rect x="14" y="14" width="10" height="10" rx="2.5" fill="none" stroke="url(#textGrad)" stroke-width="2.2"/>
    <rect x="76" y="76" width="10" height="10" rx="2.5" fill="none" stroke="url(#textGrad)" stroke-width="2.2"/>
    <circle cx="19" cy="19" r="1.5" fill="url(#textGrad)"/>
    <circle cx="81" cy="81" r="1.5" fill="url(#textGrad)"/>
  </g>
  
  <!-- Sophisticated double border -->
  <rect x="2.5" y="2.5" width="95" height="95" rx="27.5" fill="none" stroke="url(#textGrad)" stroke-width="2.2" opacity="0.3"/>
  <rect x="4.5" y="4.5" width="91" height="91" rx="25.5" fill="none" stroke="url(#textGrad)" stroke-width="1" opacity="0.15"/>
</svg>
